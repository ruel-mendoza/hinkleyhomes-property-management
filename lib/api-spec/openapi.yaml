openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: coho
    description: Server-side proxy for COHO Public API 1.1 property, calendar, and maintenance operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/validate-signup-email:
    post:
      operationId: validateSignupEmail
      tags: [auth]
      summary: Validate the staff email domain before account creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupEmailCheckRequest"
      responses:
        "200":
          description: Whether the email is allowed to register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEmailCheckResult"
        "400":
          description: Invalid email address
  /coho/status:
    get:
      operationId: getCohoStatus
      tags: [coho]
      summary: Get COHO connection status
      responses:
        "200":
          description: COHO API key configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoStatus"
  /coho/properties:
    get:
      operationId: listCohoProperties
      tags: [coho]
      summary: List COHO properties for maintenance issue mapping
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated COHO property list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoPropertiesPage"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/calendar:
    get:
      operationId: listCohoCalendar
      tags: [coho]
      summary: List COHO calendar entries
      parameters:
        - name: fromDate
          in: query
          description: ISO-8601 start of the calendar window in UTC
          schema:
            type: string
      responses:
        "200":
          description: Calendar entries from COHO calendar sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoCalendarPage"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/actions:
    get:
      operationId: listCohoActions
      tags: [coho]
      summary: List COHO actions from the Supabase mirror
      parameters:
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/CohoActionCategory"
        - name: status
          in: query
          description: open = new, in progress or on hold (default); completed; all
          schema:
            type: string
            enum: [open, completed, all]
        - name: includeSnoozed
          in: query
          schema:
            type: boolean
        - name: propertyReference
          in: query
          schema:
            type: string
            maxLength: 200
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Page of stored COHO actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionList"
        "400":
          description: Invalid filters
        "503":
          description: Database is not configured
    post:
      operationId: createCohoAction
      tags: [coho]
      summary: Create a custom action in COHO and save it to Supabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionCreate"
      responses:
        "200":
          description: The new action as saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid action details
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/assignees:
    get:
      operationId: listCohoActionAssignees
      tags: [coho]
      summary: People actions can be assigned to
      responses:
        "200":
          description: Assignable COHO team members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionAssigneeList"
        "503":
          description: Database is not configured
  /coho/actions/{reference}:
    patch:
      operationId: updateCohoAction
      tags: [coho]
      summary: Edit a custom action's title, message, notes or due date
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionEdit"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid change, or the action is not a custom action
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/status:
    patch:
      operationId: updateCohoActionStatus
      tags: [coho]
      summary: Change an action's status in COHO
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionStatusChange"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid status, or the action cannot be completed manually
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/assign:
    post:
      operationId: assignCohoAction
      tags: [coho]
      summary: Assign or unassign an action in COHO
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionAssign"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid assignee
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/snooze:
    post:
      operationId: snoozeCohoAction
      tags: [coho]
      summary: Snooze an action until a date
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionSnooze"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid snooze date
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/unsnooze:
    post:
      operationId: unsnoozeCohoAction
      tags: [coho]
      summary: Remove the snooze from an action
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/sync:
    post:
      operationId: syncCohoActions
      tags: [coho]
      summary: Pull every COHO action and save new or changed ones to Supabase
      parameters:
        - name: trigger
          in: query
          description: Recorded on the sync run; page-open when the Actions page refreshes stale data
          schema:
            type: string
            enum: [manual, page-open]
      responses:
        "200":
          description: Sync finished (or skipped because one was already running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionSyncResult"
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/viewings:
    post:
      operationId: createCohoViewing
      tags: [coho]
      summary: Book a COHO property viewing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoViewingInput"
      responses:
        "200":
          description: Created COHO viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoViewingCreated"
        "400":
          description: Invalid viewing details
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance:
    get:
      operationId: listCohoMaintenance
      tags: [coho]
      summary: List COHO maintenance issues
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: propertyReference
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated maintenance issue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoMaintenancePage"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
    post:
      operationId: createCohoMaintenance
      tags: [coho]
      summary: Create a COHO maintenance issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoMaintenanceInput"
      responses:
        "200":
          description: Created COHO maintenance issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoMaintenanceCreated"
        "400":
          description: Invalid maintenance issue input
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance/categories:
    get:
      operationId: listCohoMaintenanceCategories
      tags: [coho]
      summary: List COHO maintenance categories
      responses:
        "200":
          description: Maintenance categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoMaintenanceCategories"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance/{guid}:
    patch:
      operationId: updateCohoMaintenance
      tags: [coho]
      summary: Update COHO maintenance severity or manager notes
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoMaintenanceUpdate"
      responses:
        "200":
          description: COHO maintenance issue updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionResult"
        "400":
          description: Invalid maintenance update
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance/{guid}/complete:
    patch:
      operationId: completeCohoMaintenance
      tags: [coho]
      summary: Mark a COHO maintenance issue complete
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoMaintenanceComplete"
      responses:
        "200":
          description: COHO maintenance issue completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionResult"
        "400":
          description: Invalid completion request
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: COHO properties plus register-only properties, with open action counts
      responses:
        "200":
          description: All properties
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRegister"
        "503":
          description: Database is not configured
    post:
      operationId: createProperty
      tags: [properties]
      summary: Add a property to the Supabase register (it is not created in COHO)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyCreate"
      responses:
        "200":
          description: The saved property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySummary"
        "400":
          description: Invalid property details
        "409":
          description: A property with this address already exists
        "503":
          description: Database is not configured
  /properties/{reference}/details:
    get:
      operationId: getPropertyDetails
      tags: [properties]
      summary: Full COHO details for one property (letting, ownership and compliance records)
      parameters:
        - name: reference
          in: path
          required: true
          description: COHO property reference
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: The property's COHO details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetails"
        "404":
          description: Property not found in COHO
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /buildings:
    post:
      operationId: createBuilding
      tags: [properties]
      summary: Create a building and attach properties to it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingCreate"
      responses:
        "200":
          description: The saved building
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingSummary"
        "400":
          description: Invalid building details
        "503":
          description: Database is not configured
  /entities:
    get:
      operationId: listEntities
      tags: [properties]
      summary: Hinkley Homes group companies a property can belong to
      responses:
        "200":
          description: Group companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityList"
        "503":
          description: Database is not configured
  /occupancy:
    get:
      operationId: getOccupancy
      tags: [coho]
      summary: Every COHO unit with its current or future tenancy (rent, dates, periodic status) or vacancy
      responses:
        "200":
          description: Units and tenancies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occupancy"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /overview/money:
    get:
      operationId: getMoneyOverview
      tags: [coho]
      summary: Rent collection, arrears, deposits and rent reviews from COHO, plus banking per company from Xero
      responses:
        "200":
          description: Money overview; each source reports its own error if it could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyOverview"
  /performance:
    get:
      operationId: getPerformance
      tags: [coho]
      summary: Rent roll, rent paid on time, days late, occupancy, tenancy length, voids and satisfaction (COHO plus daily unit snapshots)
      parameters:
        - name: propertyReference
          in: query
          required: false
          description: Limit to one COHO property
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Performance metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Performance"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /public/listings:
    get:
      operationId: listPublicListings
      tags: [public]
      summary: Available rooms and properties for the website widget (no sign-in; no house numbers)
      responses:
        "200":
          description: Properties with at least one room available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListingList"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
components:
  parameters:
    CohoActionReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    OccupancyStatus:
      type: string
      enum: [fixed_term, becoming_periodic, periodic, ending, future, vacant]
    OccupancyTenant:
      type: object
      properties:
        name:
          type: string
        type:
          description: person or company
          type: ["string", "null"]
        cohoAccount:
          description: COHO app account status (e.g. joined, invited, notInvited)
          type: ["string", "null"]
      required: [name, type, cohoAccount]
    OccupancyRow:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
        unitReference:
          type: string
        unitName:
          type: string
        unitsInProperty:
          type: integer
        tenancyGuid:
          type: ["string", "null"]
        tenancyNumber:
          type: ["string", "null"]
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/OccupancyTenant"
        rent:
          description: Tenancy rent, or the unit's advertised rent for vacant units
          type: ["number", "null"]
        paymentFrequency:
          type: ["string", "null"]
        startDate:
          description: UK date (YYYY-MM-DD)
          type: ["string", "null"]
        fixedTermEnd:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        availableFrom:
          type: ["string", "null"]
        nextRentReview:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/OccupancyStatus"
      required: [propertyReference, propertyName, unitReference, unitName, unitsInProperty, tenancyGuid, tenancyNumber, tenants, rent, paymentFrequency, startDate, fixedTermEnd, endDate, availableFrom, nextRentReview, status]
    Occupancy:
      type: object
      properties:
        asOf:
          description: Today's UK date the statuses were worked out for
          type: string
        becomingPeriodicDays:
          description: A fixed term ending within this many days counts as becoming periodic
          type: integer
        units:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/OccupancyRow"
      required: [asOf, becomingPeriodicDays, units, rows]
    MoneyArrear:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
        tenantName:
          type: ["string", "null"]
        outstanding:
          type: number
        daysInArrears:
          type: integer
        earliestDue:
          description: UK date (YYYY-MM-DD)
          type: ["string", "null"]
      required: [propertyReference, propertyName, tenantName, outstanding, daysInArrears, earliestDue]
    MoneyPropertyRef:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
      required: [propertyReference, propertyName]
    MoneyRentReview:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
        currentRent:
          type: ["number", "null"]
        paymentFrequency:
          type: ["string", "null"]
        nextReview:
          type: string
        overdue:
          type: boolean
      required: [propertyReference, propertyName, currentRent, paymentFrequency, nextReview, overdue]
    MoneyCoho:
      type: object
      properties:
        error:
          type: ["string", "null"]
        paidThisMonth:
          type: number
        dueThisMonth:
          type: number
        dueNextMonth:
          type: number
        dueToday:
          type: number
        overdue:
          type: number
        arrears:
          type: array
          items:
            $ref: "#/components/schemas/MoneyArrear"
        depositsHeld:
          type: integer
        depositsHeldTotal:
          type: number
        depositsPending:
          type: integer
        depositsClosing:
          type: integer
        depositsClosingOverdue:
          type: integer
        tenanciesWithoutDeposit:
          type: array
          items:
            $ref: "#/components/schemas/MoneyPropertyRef"
        rentReviews:
          description: Tenancy rent reviews overdue or due within 28 days
          type: array
          items:
            $ref: "#/components/schemas/MoneyRentReview"
      required: [error, paidThisMonth, dueThisMonth, dueNextMonth, dueToday, overdue, arrears, depositsHeld, depositsHeldTotal, depositsPending, depositsClosing, depositsClosingOverdue, tenanciesWithoutDeposit, rentReviews]
    MoneyBankAccount:
      type: object
      properties:
        name:
          type: string
        kind:
          description: bank = real bank or cash account; card = credit/charge card; payments = payment platform clearing account (Stripe, PayPal, GoCardless, Telleroo)
          type: string
          enum: [bank, card, payments]
        balance:
          description: Closing balance today from Xero's Bank Summary; null when the report is unavailable
          type: ["number", "null"]
        moneyIn:
          description: Received this month
          type: ["number", "null"]
        moneyOut:
          description: Spent this month
          type: ["number", "null"]
      required: [name, kind, balance, moneyIn, moneyOut]
    MoneyCompany:
      type: object
      properties:
        tenantId:
          type: string
        name:
          type: string
        holdsPropertyMoney:
          type: boolean
        note:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        unreconciledCount:
          type: integer
        unreconciledIn:
          type: number
        unreconciledOut:
          type: number
        oldestUnreconciled:
          type: ["string", "null"]
        bankAccounts:
          type: array
          items:
            $ref: "#/components/schemas/MoneyBankAccount"
        balancesError:
          description: Why balances are missing (e.g. the Xero reports permission is not granted in n8n)
          type: ["string", "null"]
        bankTotal:
          description: Sum of closing balances of real bank accounts only (cards and payment platforms excluded); null when balances are unavailable
          type: ["number", "null"]
        notices:
          description: Things the accounts team should check, shown prominently on the overview
          type: array
          items:
            type: string
      required: [tenantId, name, holdsPropertyMoney, note, error, unreconciledCount, unreconciledIn, unreconciledOut, oldestUnreconciled, bankAccounts, balancesError, bankTotal, notices]
    MoneyXero:
      type: object
      properties:
        error:
          type: ["string", "null"]
        companies:
          type: array
          items:
            $ref: "#/components/schemas/MoneyCompany"
      required: [error, companies]
    MoneyOverview:
      type: object
      properties:
        asOf:
          description: When the figures were fetched (ISO date-time)
          type: string
        coho:
          $ref: "#/components/schemas/MoneyCoho"
        xero:
          $ref: "#/components/schemas/MoneyXero"
      required: [asOf, coho, xero]
    PerformanceRentRollMonth:
      type: object
      properties:
        month:
          description: YYYY-MM
          type: string
        amount:
          description: Rent due in the month
          type: number
        target:
          description: Sum of advertised rents for the units in scope
          type: number
        percent:
          type: ["integer", "null"]
      required: [month, amount, target, percent]
    PerformancePeriodKey:
      type: string
      enum: [month_to_date, last_month, last_90_days, last_year]
    PerformancePeriod:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/PerformancePeriodKey"
        label:
          type: string
        from:
          type: string
        to:
          type: string
        rentRecords:
          description: Rent payments due in the period (up to today)
          type: integer
        paidOnTimePercent:
          type: ["number", "null"]
        averageDaysLate:
          type: ["number", "null"]
        occupancyPercent:
          type: ["number", "null"]
        occupancyComplete:
          description: False when the period starts before snapshots began, so ended tenancies may be missing
          type: boolean
        satisfaction:
          type: ["number", "null"]
        satisfactionResponses:
          type: integer
