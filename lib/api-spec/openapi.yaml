openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: coho
    description: Server-side proxy for COHO Public API 1.1 property, calendar, and maintenance operations
  - name: xero
    description: Xero data through the read-only n8n gateway, plus follow-up notes kept in Supabase
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/validate-signup-email:
    post:
      operationId: validateSignupEmail
      tags: [auth]
      summary: Validate the staff email domain before account creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupEmailCheckRequest"
      responses:
        "200":
          description: Whether the email is allowed to register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEmailCheckResult"
        "400":
          description: Invalid email address
  /coho/status:
    get:
      operationId: getCohoStatus
      tags: [coho]
      summary: Get COHO connection status
      responses:
        "200":
          description: COHO API key configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoStatus"
  /coho/properties:
    get:
      operationId: listCohoProperties
      tags: [coho]
      summary: List COHO properties for maintenance issue mapping
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated COHO property list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoPropertiesPage"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/calendar:
    get:
      operationId: listCohoCalendar
      tags: [coho]
      summary: List COHO calendar entries
      parameters:
        - name: fromDate
          in: query
          description: ISO-8601 start of the calendar window in UTC
          schema:
            type: string
      responses:
        "200":
          description: Calendar entries from COHO calendar sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoCalendarPage"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/actions:
    get:
      operationId: listCohoActions
      tags: [coho]
      summary: List COHO actions from the Supabase mirror
      parameters:
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/CohoActionCategory"
        - name: status
          in: query
          description: open = new, in progress or on hold (default); completed; all
          schema:
            type: string
            enum: [open, completed, all]
        - name: includeSnoozed
          in: query
          schema:
            type: boolean
        - name: propertyReference
          in: query
          schema:
            type: string
            maxLength: 200
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Page of stored COHO actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionList"
        "400":
          description: Invalid filters
        "503":
          description: Database is not configured
    post:
      operationId: createCohoAction
      tags: [coho]
      summary: Create a custom action in COHO and save it to Supabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionCreate"
      responses:
        "200":
          description: The new action as saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid action details
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/assignees:
    get:
      operationId: listCohoActionAssignees
      tags: [coho]
      summary: People actions can be assigned to
      responses:
        "200":
          description: Assignable COHO team members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionAssigneeList"
        "503":
          description: Database is not configured
  /coho/actions/{reference}:
    patch:
      operationId: updateCohoAction
      tags: [coho]
      summary: Edit a custom action's title, message, notes or due date
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionEdit"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid change, or the action is not a custom action
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/status:
    patch:
      operationId: updateCohoActionStatus
      tags: [coho]
      summary: Change an action's status in COHO
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionStatusChange"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid status, or the action cannot be completed manually
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/assign:
    post:
      operationId: assignCohoAction
      tags: [coho]
      summary: Assign or unassign an action in COHO
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionAssign"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid assignee
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/snooze:
    post:
      operationId: snoozeCohoAction
      tags: [coho]
      summary: Snooze an action until a date
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionSnooze"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid snooze date
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/unsnooze:
    post:
      operationId: unsnoozeCohoAction
      tags: [coho]
      summary: Remove the snooze from an action
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/sync:
    post:
      operationId: syncCohoActions
      tags: [coho]
      summary: Pull every COHO action and save new or changed ones to Supabase
      parameters:
        - name: trigger
          in: query
          description: Recorded on the sync run; page-open when the Actions page refreshes stale data
          schema:
            type: string
            enum: [manual, page-open]
      responses:
        "200":
          description: Sync finished (or skipped because one was already running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionSyncResult"
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/viewings:
    post:
      operationId: createCohoViewing
      tags: [coho]
      summary: Book a COHO property viewing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoViewingInput"
      responses:
        "200":
          description: Created COHO viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoViewingCreated"
        "400":
          description: Invalid viewing details
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance:
    get:
      operationId: listCohoMaintenance
      tags: [coho]
      summary: List COHO maintenance issues
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: propertyReference
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated maintenance issue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoMaintenancePage"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
    post:
      operationId: createCohoMaintenance
      tags: [coho]
      summary: Create a COHO maintenance issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoMaintenanceInput"
      responses:
        "200":
          description: Created COHO maintenance issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoMaintenanceCreated"
        "400":
          description: Invalid maintenance issue input
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance/categories:
    get:
      operationId: listCohoMaintenanceCategories
      tags: [coho]
      summary: List COHO maintenance categories
      responses:
        "200":
          description: Maintenance categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoMaintenanceCategories"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance/{guid}:
    patch:
      operationId: updateCohoMaintenance
      tags: [coho]
      summary: Update COHO maintenance severity or manager notes
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoMaintenanceUpdate"
      responses:
        "200":
          description: COHO maintenance issue updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionResult"
        "400":
          description: Invalid maintenance update
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance/{guid}/complete:
    patch:
      operationId: completeCohoMaintenance
      tags: [coho]
      summary: Mark a COHO maintenance issue complete
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoMaintenanceComplete"
      responses:
        "200":
          description: COHO maintenance issue completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionResult"
        "400":
          description: Invalid completion request
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: COHO properties plus register-only properties, with open action counts
      responses:
        "200":
          description: All properties
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyRegister"
        "503":
          description: Database is not configured
    post:
      operationId: createProperty
      tags: [properties]
      summary: Add a property to the Supabase register (it is not created in COHO)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyCreate"
      responses:
        "200":
          description: The saved property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySummary"
        "400":
          description: Invalid property details
        "409":
          description: A property with this address already exists
        "503":
          description: Database is not configured
  /properties/{reference}/details:
    get:
      operationId: getPropertyDetails
      tags: [properties]
      summary: Full COHO details for one property (letting, ownership and compliance records)
      parameters:
        - name: reference
          in: path
          required: true
          description: COHO property reference
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: The property's COHO details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDetails"
        "404":
          description: Property not found in COHO
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /buildings:
    post:
      operationId: createBuilding
      tags: [properties]
      summary: Create a building and attach properties to it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildingCreate"
      responses:
        "200":
          description: The saved building
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildingSummary"
        "400":
          description: Invalid building details
        "503":
          description: Database is not configured
  /entities:
    get:
      operationId: listEntities
      tags: [properties]
      summary: Hinkley Homes group companies a property can belong to
      responses:
        "200":
          description: Group companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityList"
        "503":
          description: Database is not configured
  /occupancy:
    get:
      operationId: getOccupancy
      tags: [coho]
      summary: Every COHO unit with its current or future tenancy (rent, dates, periodic status) or vacancy
      responses:
        "200":
          description: Units and tenancies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occupancy"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /overview/money:
    get:
      operationId: getMoneyOverview
      tags: [coho]
      summary: Rent collection, arrears, deposits and rent reviews from COHO, plus banking per company from Xero
      responses:
        "200":
          description: Money overview; each source reports its own error if it could not be loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoneyOverview"
  /performance:
    get:
      operationId: getPerformance
      tags: [coho]
      summary: Rent roll, rent paid on time, days late, occupancy, tenancy length, voids and satisfaction (COHO plus daily unit snapshots)
      parameters:
        - name: propertyReference
          in: query
          required: false
          description: Limit to one COHO property
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Performance metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Performance"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /compliance:
    get:
      operationId: getCompliance
      tags: [coho]
      summary: COHO compliance items for every property, filtered by status, with counts by type and each item's dates
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ComplianceFilter"
      responses:
        "200":
          description: Compliance items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceList"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /finance/income:
    get:
      operationId: getFinanceIncome
      tags: [coho]
      summary: Rent invoiced and management fees by month, property and owner over the last 12 months (COHO financial items)
      responses:
        "200":
          description: Rent and fee income
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceIncome"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /finance/bank-feed:
    get:
      operationId: getFinanceBankFeed
      tags: [coho]
      summary: COHO's rent bank feed (bank lines matched or not matched to rent) over the last 12 months
      responses:
        "200":
          description: Bank feed lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceBankFeed"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /receivables:
    get:
      operationId: getReceivables
      tags: [xero]
      summary: Open sales invoices (owed to us) and bills (we owe) across all Xero companies, with our follow-up state
      responses:
        "200":
          description: Receivables and payables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receivables"
        "503":
          description: The n8n Xero gateway is not configured
  /receivables/{tenantId}/{invoiceId}/payment-link:
    get:
      operationId: getInvoicePaymentLink
      tags: [xero]
      summary: Xero's online "view and pay" link for a sales invoice
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Xero organisation (tenant) id
          schema:
            type: string
            format: uuid
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoicePaymentLink"
        "404":
          description: No online invoice for this invoice
        "502":
          description: Xero returned an error
  /receivables/{tenantId}/{invoiceId}/follow-up:
    put:
      operationId: updateInvoiceFollowUp
      tags: [xero]
      summary: Record a follow-up on a sales invoice (stored in Supabase only; nothing is sent to Xero or the customer)
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Xero organisation (tenant) id
          schema:
            type: string
            format: uuid
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceFollowUpUpdate"
      responses:
        "200":
          description: The saved follow-up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceFollowUp"
        "400":
          description: Invalid follow-up
        "503":
          description: Database is not configured
  /reminders/settings:
    get:
      operationId: getReminderSettings
      tags: [xero]
      summary: Payment reminder settings (automatic reminders on/off, test or live, stages and safeguards)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderSettings"
        "503":
          description: Database is not configured
    put:
      operationId: updateReminderSettings
      tags: [xero]
      summary: Change payment reminder settings (audit-logged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderSettingsUpdate"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderSettings"
        "400":
          description: Invalid settings
  /receivables/{tenantId}/{invoiceId}/actions:
    post:
      operationId: runInvoiceAction
      tags: [xero]
      summary: Send a reminder now, re-send the invoice from Xero, or add a note to the invoice in Xero (through the n8n reminders workflow)
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceActionRequest"
      responses:
        "200":
          description: What happened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceActionResult"
        "400":
          description: Action not allowed (e.g. Xero actions in test mode)
        "502":
          description: The n8n workflow or Xero returned an error
        "503":
          description: The reminders workflow is not configured
  /presence:
    get:
      operationId: getPresence
      tags: [health]
      summary: Staff who are using the app now, and when others were last seen
      responses:
        "200":
          description: Staff presence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceList"
        "503":
          description: Database is not configured
  /presence/heartbeat:
    post:
      operationId: sendPresenceHeartbeat
      tags: [health]
      summary: Mark the signed-in staff member as using the app (sent about once a minute) and return everyone's presence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceHeartbeat"
      responses:
        "200":
          description: Staff presence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceList"
        "503":
          description: Database is not configured
  /checks/overdue:
    get:
      operationId: getOverdueReport
      tags: [xero]
      summary: Overdue invoices and bills across all five companies, ranked by value, age and risk, with what is new or more urgent since the last daily check
      responses:
        "200":
          description: Ranked overdue items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverdueReport"
        "502":
          description: Xero could not be read
        "503":
          description: Database or Xero gateway is not configured
  /checks/alerts:
    get:
      operationId: listFinanceAlerts
      tags: [xero]
      summary: Bill price, bank-detail and spend-trend alerts from the daily checks (the exception queue)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/FinanceAlertFilter"
      responses:
        "200":
          description: Alerts, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAlertList"
        "503":
          description: Database is not configured
  /checks/alerts/{id}:
    put:
      operationId: updateFinanceAlert
      tags: [xero]
      summary: Resolve, ignore or reopen an alert (written to the audit log)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceAlertUpdate"
      responses:
        "200":
          description: The updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinanceAlert"
        "400":
          description: Invalid update
        "404":
          description: Alert not found
        "503":
          description: Database is not configured
  /checks/reminders:
    get:
      operationId: listReminderLog
      tags: [xero]
      summary: Payment reminders, invoice re-sends and Xero notes the reminders workflow has carried out, newest first
      responses:
        "200":
          description: Reminder log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderLogList"
        "503":
          description: Database is not configured
  /checks/runs:
    get:
      operationId: listCheckRuns
      tags: [xero]
      summary: Recent Xero daily check runs
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckRunList"
        "503":
          description: Database is not configured
    post:
      operationId: runChecksNow
      tags: [xero]
      summary: Run the Xero daily checks now (reads Xero; the first run reads 13 months of bills)
      responses:
        "200":
          description: The finished run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckRun"
        "409":
          description: A run is already in progress
        "503":
          description: Database or Xero gateway is not configured
  /bill-coding/reviews:
    get:
      operationId: listBillReviews
      tags: [xero]
      summary: Supplier bills the bill coding workflow has read, latest review per bill
      parameters:
        - name: view
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BillReviewView"
      responses:
        "200":
          description: Reviews, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillReviewList"
        "503":
          description: Database is not configured
  /bill-coding/reviews/{id}/answers:
    post:
      operationId: answerBillReview
      tags: [xero]
      summary: Say which property (or company overhead) each held line belongs to; the next hourly run checks the bill again
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillReviewAnswers"
      responses:
        "200":
          description: Answers saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Invalid answers
        "404":
          description: Review not found
        "503":
          description: Database is not configured
  /bill-coding/settings:
    get:
      operationId: getBillCodingSettings
      tags: [xero]
      summary: Bill coding settings (shadow mode, automatic splitting, account codes)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillCodingSettings"
        "503":
          description: Database is not configured
    put:
      operationId: updateBillCodingSettings
      tags: [xero]
      summary: Change bill coding settings (written to the audit log)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillCodingSettingsUpdate"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillCodingSettings"
        "400":
          description: Invalid settings
        "503":
          description: Database is not configured
  /bill-coding/tracking-options:
    get:
      operationId: getTrackingOptions
      tags: [xero]
      summary: Property tracking options in each company's Xero (for choosing a property)
      responses:
        "200":
          description: Options per company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingOptions"
        "503":
          description: Xero gateway or database is not configured
  /property-aliases:
    get:
      operationId: listPropertyAliases
      tags: [properties]
      summary: Property aliases (spellings and bill line answers) and the property each points to
      responses:
        "200":
          description: Aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyAliasList"
        "503":
          description: Database is not configured
    post:
      operationId: createPropertyAlias
      tags: [properties]
      summary: Add a property alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyAliasInput"
      responses:
        "201":
          description: The new alias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyAlias"
        "400":
          description: Invalid alias
        "409":
          description: The alias already exists
        "503":
          description: Database is not configured
  /property-aliases/{id}:
    put:
      operationId: updatePropertyAlias
      tags: [properties]
      summary: Change a property alias
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyAliasInput"
      responses:
        "200":
          description: The changed alias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyAlias"
        "400":
          description: Invalid alias
        "404":
          description: Alias not found
        "409":
          description: Another alias already has this spelling
        "503":
          description: Database is not configured
    delete:
      operationId: deletePropertyAlias
      tags: [properties]
      summary: Delete a property alias
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: Alias not found
        "503":
          description: Database is not configured
  /company-aliases:
    get:
      operationId: listCompanyAliases
      tags: [properties]
      summary: How company names are written on supplier invoices, and the Xero organisation each means
      responses:
        "200":
          description: Company aliases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyAliasList"
        "503":
          description: Database is not configured
    post:
      operationId: createCompanyAlias
      tags: [properties]
      summary: Add a company alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyAliasInput"
      responses:
        "201":
          description: The new alias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyAlias"
        "400":
          description: Invalid alias
        "409":
          description: The alias already exists
        "503":
          description: Database is not configured
  /company-aliases/{id}:
    put:
      operationId: updateCompanyAlias
      tags: [properties]
      summary: Change a company alias
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyAliasInput"
      responses:
        "200":
          description: The changed alias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyAlias"
        "400":
          description: Invalid alias
        "404":
          description: Alias not found
        "409":
          description: Another alias already has this spelling
        "503":
          description: Database is not configured
    delete:
      operationId: deleteCompanyAlias
      tags: [properties]
      summary: Delete a company alias
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: Alias not found
        "503":
          description: Database is not configured
  /public/listings:
    get:
      operationId: listPublicListings
      tags: [public]
      summary: Available rooms and properties for the website widget (no sign-in; no house numbers)
      responses:
        "200":
          description: Properties with at least one room available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListingList"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
components:
  parameters:
    CohoActionReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    OccupancyStatus:
      type: string
      enum: [fixed_term, becoming_periodic, periodic, ending, future, vacant]
    OccupancyTenant:
      type: object
      properties:
        name:
          type: string
        type:
          description: person or company
          type: ["string", "null"]
        cohoAccount:
          description: COHO app account status (e.g. joined, invited, notInvited)
          type: ["string", "null"]
      required: [name, type, cohoAccount]
    OccupancyRow:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
        unitReference:
          type: string
        unitName:
          type: string
        unitsInProperty:
          type: integer
        tenancyGuid:
          type: ["string", "null"]
        tenancyNumber:
          type: ["string", "null"]
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/OccupancyTenant"
        rent:
          description: Tenancy rent, or the unit's advertised rent for vacant units
          type: ["number", "null"]
        paymentFrequency:
          type: ["string", "null"]
        startDate:
          description: UK date (YYYY-MM-DD)
          type: ["string", "null"]
        fixedTermEnd:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        availableFrom:
          type: ["string", "null"]
        nextRentReview:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/OccupancyStatus"
      required: [propertyReference, propertyName, unitReference, unitName, unitsInProperty, tenancyGuid, tenancyNumber, tenants, rent, paymentFrequency, startDate, fixedTermEnd, endDate, availableFrom, nextRentReview, status]
    Occupancy:
      type: object
      properties:
        asOf:
          description: Today's UK date the statuses were worked out for
          type: string
        becomingPeriodicDays:
          description: A fixed term ending within this many days counts as becoming periodic
          type: integer
        units:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/OccupancyRow"
      required: [asOf, becomingPeriodicDays, units, rows]
    MoneyArrear:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
        tenantName:
          type: ["string", "null"]
        outstanding:
          type: number
        daysInArrears:
          type: integer
        earliestDue:
          description: UK date (YYYY-MM-DD)
          type: ["string", "null"]
        possiblePayment:
          description: An unmatched bank line in COHO's rent feed for the same amount, so the rent may already be paid
          oneOf:
            - $ref: "#/components/schemas/PossiblePayment"
            - type: "null"
      required: [propertyReference, propertyName, tenantName, outstanding, daysInArrears, earliestDue, possiblePayment]
    MoneyPropertyRef:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
      required: [propertyReference, propertyName]
    MoneyRentReview:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
        currentRent:
          type: ["number", "null"]
        paymentFrequency:
          type: ["string", "null"]
        nextReview:
          type: string
        overdue:
          type: boolean
      required: [propertyReference, propertyName, currentRent, paymentFrequency, nextReview, overdue]
    MoneyCoho:
      type: object
      properties:
        error:
          type: ["string", "null"]
        paidThisMonth:
          type: number
        dueThisMonth:
          type: number
        dueNextMonth:
          type: number
        dueToday:
          type: number
        overdue:
          type: number
        arrears:
          type: array
          items:
            $ref: "#/components/schemas/MoneyArrear"
        depositsHeld:
          type: integer
        depositsHeldTotal:
          type: number
        depositsPending:
          type: integer
        depositsClosing:
          type: integer
        depositsClosingOverdue:
          type: integer
        tenanciesWithoutDeposit:
          type: array
          items:
            $ref: "#/components/schemas/MoneyPropertyRef"
        rentReviews:
          description: Tenancy rent reviews overdue or due within 28 days
          type: array
          items:
            $ref: "#/components/schemas/MoneyRentReview"
      required: [error, paidThisMonth, dueThisMonth, dueNextMonth, dueToday, overdue, arrears, depositsHeld, depositsHeldTotal, depositsPending, depositsClosing, depositsClosingOverdue, tenanciesWithoutDeposit, rentReviews]
    MoneyBankAccount:
      type: object
      properties:
        name:
          type: string
        kind:
          description: bank = real bank or cash account; card = credit/charge card; payments = payment platform clearing account (Stripe, PayPal, GoCardless, Telleroo)
          type: string
          enum: [bank, card, payments]
        balance:
          description: Closing balance today from Xero's Bank Summary; null when the report is unavailable
          type: ["number", "null"]
        moneyIn:
          description: Received this month
          type: ["number", "null"]
        moneyOut:
          description: Spent this month
          type: ["number", "null"]
      required: [name, kind, balance, moneyIn, moneyOut]
    MoneyCompany:
      type: object
      properties:
        tenantId:
          type: string
        name:
          type: string
        holdsPropertyMoney:
          type: boolean
        note:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        unreconciledCount:
          type: integer
        unreconciledIn:
          type: number
        unreconciledOut:
          type: number
        oldestUnreconciled:
          type: ["string", "null"]
        bankAccounts:
          type: array
          items:
            $ref: "#/components/schemas/MoneyBankAccount"
        balancesError:
          description: Why balances are missing (e.g. the Xero reports permission is not granted in n8n)
          type: ["string", "null"]
        bankTotal:
          description: Sum of closing balances of real bank accounts only (cards and payment platforms excluded); null when balances are unavailable
          type: ["number", "null"]
        notices:
          description: Things the accounts team should check, shown prominently on the overview
          type: array
          items:
            type: string
      required: [tenantId, name, holdsPropertyMoney, note, error, unreconciledCount, unreconciledIn, unreconciledOut, oldestUnreconciled, bankAccounts, balancesError, bankTotal, notices]
    MoneyXero:
      type: object
      properties:
        error:
          type: ["string", "null"]
        companies:
          type: array
          items:
            $ref: "#/components/schemas/MoneyCompany"
      required: [error, companies]
    MoneyOverview:
      type: object
      properties:
        asOf:
          description: When the figures were fetched (ISO date-time)
          type: string
        coho:
          $ref: "#/components/schemas/MoneyCoho"
        xero:
          $ref: "#/components/schemas/MoneyXero"
      required: [asOf, coho, xero]
    PerformanceRentRollMonth:
      type: object
      properties:
        month:
          description: YYYY-MM
          type: string
        amount:
          description: Rent due in the month
          type: number
        target:
          description: Sum of advertised rents for the units in scope
          type: number
        percent:
          type: ["integer", "null"]
      required: [month, amount, target, percent]
    PerformancePeriodKey:
      type: string
      enum: [month_to_date, last_month, last_90_days, last_year]
    PerformancePeriod:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/PerformancePeriodKey"
        label:
          type: string
        from:
          type: string
        to:
          type: string
        rentRecords:
          description: Rent payments due in the period (up to today)
          type: integer
        paidOnTimePercent:
          type: ["number", "null"]
        averageDaysLate:
          type: ["number", "null"]
        occupancyPercent:
          type: ["number", "null"]
        occupancyComplete:
          description: False when the period starts before snapshots began, so ended tenancies may be missing
          type: boolean
        satisfaction:
          type: ["number", "null"]
        satisfactionResponses:
          type: integer
        daysToFillVoids:
          type: ["number", "null"]
        voidsFilled:
          type: integer
      required: [key, label, from, to, rentRecords, paidOnTimePercent, averageDaysLate, occupancyPercent, occupancyComplete, satisfaction, satisfactionResponses, daysToFillVoids, voidsFilled]
    Performance:
      type: object
      properties:
        asOf:
          description: UK date the figures are for
          type: string
        propertyReference:
          type: ["string", "null"]
        units:
          type: integer
        occupiedToday:
          type: integer
        occupancyTodayPercent:
          type: ["number", "null"]
        rentRollThisMonth:
          $ref: "#/components/schemas/PerformanceRentRollMonth"
        rentRollLastMonth:
          $ref: "#/components/schemas/PerformanceRentRollMonth"
        periods:
          type: array
          items:
            $ref: "#/components/schemas/PerformancePeriod"
        averageTenancyMonths:
          description: Average length of tenancies known to the app (current ones to today, ended ones from snapshots)
          type: ["number", "null"]
        tenanciesCounted:
          type: integer
        snapshotsSince:
          description: First day of unit snapshots; history before it is incomplete
          type: ["string", "null"]
        snapshotError:
          description: Set when today's snapshot could not be saved
          type: ["string", "null"]
      required: [asOf, propertyReference, units, occupiedToday, occupancyTodayPercent, rentRollThisMonth, rentRollLastMonth, periods, averageTenancyMonths, tenanciesCounted, snapshotsSince, snapshotError]
    ComplianceFilter:
      type: string
      enum: [expired, due_30, due_60, due_90, not_started, not_required, all]
    ComplianceItemStatus:
      type: string
      enum: [expired, due_soon, not_started, not_required, in_date]
    ComplianceTypeCount:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        count:
          type: integer
      required: [key, name, count]
    ComplianceCategoryCount:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        count:
          type: integer
        types:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceTypeCount"
      required: [key, name, count, types]
    ComplianceRow:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
        categoryKey:
          type: string
        categoryName:
          type: string
        typeKey:
          type: string
        typeName:
          type: string
        status:
          $ref: "#/components/schemas/ComplianceItemStatus"
        carriedOut:
          description: UK date (YYYY-MM-DD) of the latest record
          type: ["string", "null"]
        expiry:
          description: UK date the latest record expires (worked out from COHO's validity period when COHO gives none)
          type: ["string", "null"]
      required: [propertyReference, propertyName, categoryKey, categoryName, typeKey, typeName, status, carriedOut, expiry]
    ComplianceList:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ComplianceFilter"
        asOf:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceCategoryCount"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceRow"
        datesUnavailable:
          description: Properties whose record dates could not be loaded from COHO
          type: array
          items:
            type: string
      required: [status, asOf, categories, rows, datesUnavailable]
    FinanceIncomeMonth:
      type: object
      properties:
        month:
          description: YYYY-MM
          type: string
        rent:
          type: number
        fees:
          type: number
        unpaid:
          type: number
      required: [month, rent, fees, unpaid]
    FinanceIncomeProperty:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
        ownerName:
          type: ["string", "null"]
        rent:
          type: number
        fees:
          type: number
        unpaid:
          type: number
        lastPaid:
          type: ["string", "null"]
      required: [propertyReference, propertyName, ownerName, rent, fees, unpaid, lastPaid]
    FinanceIncomeOwner:
      type: object
      properties:
        ownerReference:
          type: string
        ownerName:
          type: string
        properties:
          type: integer
        rent:
          type: number
        fees:
          type: number
      required: [ownerReference, ownerName, properties, rent, fees]
    FinanceIncome:
      type: object
      properties:
        asOf:
          type: string
        from:
          type: string
        rentTotal:
          type: number
        feesTotal:
          type: number
        feeRatePercent:
          type: ["number", "null"]
        unpaidTotal:
          type: number
        unpaidCount:
          type: integer
        otherTotal:
          description: Financial items that are neither rent nor management fees (expenses are normally recorded in Xero)
          type: number
        months:
          type: array
          items:
            $ref: "#/components/schemas/FinanceIncomeMonth"
        properties:
          type: array
          items:
            $ref: "#/components/schemas/FinanceIncomeProperty"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/FinanceIncomeOwner"
        items:
          type: array
          items:
            $ref: "#/components/schemas/FinanceItem"
      required: [asOf, from, rentTotal, feesTotal, feeRatePercent, unpaidTotal, unpaidCount, otherTotal, months, properties, owners, items]
    FinanceItem:
      type: object
      properties:
        id:
          type: string
        invoiceDate:
          type: string
        category:
          type: string
          enum: [rent, management_fee, other]
        categoryName:
          type: string
        propertyReference:
          type: string
        propertyName:
          type: string
        ownerReference:
          type: ["string", "null"]
        ownerName:
          type: ["string", "null"]
        tenantName:
          type: ["string", "null"]
        amount:
          type: number
        unpaid:
          type: number
        paidStatus:
          type: string
        paidDate:
          type: ["string", "null"]
      required: [id, invoiceDate, category, categoryName, propertyReference, propertyName, ownerReference, ownerName, tenantName, amount, unpaid, paidStatus, paidDate]
    FinanceBankLineStatus:
      type: string
      enum: [matched, partly_matched, unmatched, excluded]
    FinanceBankLine:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        amount:
          type: number
        payer:
          type: ["string", "null"]
        reference:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/FinanceBankLineStatus"
        possibleDuplicate:
          type: boolean
        account:
          description: Bank and last four digits of the account
          type: ["string", "null"]
        snoozedUntil:
          type: ["string", "null"]
        possibleMatch:
          description: An overdue tenancy this unmatched line may pay (same amount, around the due date); matching is done in COHO
          oneOf:
            - $ref: "#/components/schemas/PossibleRentMatch"
            - type: "null"
      required: [id, date, amount, payer, reference, description, status, possibleDuplicate, account, snoozedUntil, possibleMatch]
    PossibleRentMatch:
      type: object
      properties:
        propertyReference:
          type: string
        propertyName:
          type: string
        tenantName:
          type: ["string", "null"]
        tenancyNumber:
          type: ["string", "null"]
        outstanding:
          type: number
        earliestDue:
          type: ["string", "null"]
        daysInArrears:
          type: integer
        reason:
          description: Why this line was proposed, in plain English
          type: string
      required: [propertyReference, propertyName, tenantName, tenancyNumber, outstanding, earliestDue, daysInArrears, reason]
    PossiblePayment:
      type: object
      properties:
        date:
          type: string
        amount:
          type: number
        payer:
          type: ["string", "null"]
        reference:
          type: ["string", "null"]
      required: [date, amount, payer, reference]
    FinanceBankFeedMonth:
      type: object
      properties:
        month:
          type: string
        matched:
          type: number
        unmatched:
          type: number
      required: [month, matched, unmatched]
    FinanceBankFeed:
      type: object
      properties:
        asOf:
          type: string
        from:
          type: string
        accounts:
          description: Bank and last four digits of each account in the feed
          type: array
          items:
            type: string
        matchedCount:
          type: integer
        unmatchedCount:
          type: integer
        excludedCount:
          type: integer
        matchedAmount:
          type: number
        unmatchedAmount:
          type: number
        oldestUnmatched:
          type: ["string", "null"]
        months:
