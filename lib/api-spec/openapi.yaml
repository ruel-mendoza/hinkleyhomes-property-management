openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: coho
    description: Server-side proxy for COHO Public API 1.1 property, calendar, and maintenance operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/validate-signup-email:
    post:
      operationId: validateSignupEmail
      tags: [auth]
      summary: Validate the staff email domain before account creation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupEmailCheckRequest"
      responses:
        "200":
          description: Whether the email is allowed to register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupEmailCheckResult"
        "400":
          description: Invalid email address
  /coho/status:
    get:
      operationId: getCohoStatus
      tags: [coho]
      summary: Get COHO connection status
      responses:
        "200":
          description: COHO API key configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoStatus"
  /coho/properties:
    get:
      operationId: listCohoProperties
      tags: [coho]
      summary: List COHO properties for maintenance issue mapping
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated COHO property list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoPropertiesPage"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/calendar:
    get:
      operationId: listCohoCalendar
      tags: [coho]
      summary: List COHO calendar entries
      parameters:
        - name: fromDate
          in: query
          description: ISO-8601 start of the calendar window in UTC
          schema:
            type: string
      responses:
        "200":
          description: Calendar entries from COHO calendar sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoCalendarPage"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/actions:
    get:
      operationId: listCohoActions
      tags: [coho]
      summary: List COHO actions from the Supabase mirror
      parameters:
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/CohoActionCategory"
        - name: status
          in: query
          description: open = new, in progress or on hold (default); completed; all
          schema:
            type: string
            enum: [open, completed, all]
        - name: includeSnoozed
          in: query
          schema:
            type: boolean
        - name: propertyReference
          in: query
          schema:
            type: string
            maxLength: 200
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Page of stored COHO actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionList"
        "400":
          description: Invalid filters
        "503":
          description: Database is not configured
    post:
      operationId: createCohoAction
      tags: [coho]
      summary: Create a custom action in COHO and save it to Supabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionCreate"
      responses:
        "200":
          description: The new action as saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid action details
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/assignees:
    get:
      operationId: listCohoActionAssignees
      tags: [coho]
      summary: People actions can be assigned to
      responses:
        "200":
          description: Assignable COHO team members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionAssigneeList"
        "503":
          description: Database is not configured
  /coho/actions/{reference}:
    patch:
      operationId: updateCohoAction
      tags: [coho]
      summary: Edit a custom action's title, message, notes or due date
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionEdit"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid change, or the action is not a custom action
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/status:
    patch:
      operationId: updateCohoActionStatus
      tags: [coho]
      summary: Change an action's status in COHO
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionStatusChange"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid status, or the action cannot be completed manually
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/assign:
    post:
      operationId: assignCohoAction
      tags: [coho]
      summary: Assign or unassign an action in COHO
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionAssign"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid assignee
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/snooze:
    post:
      operationId: snoozeCohoAction
      tags: [coho]
      summary: Snooze an action until a date
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoActionSnooze"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "400":
          description: Invalid snooze date
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/{reference}/unsnooze:
    post:
      operationId: unsnoozeCohoAction
      tags: [coho]
      summary: Remove the snooze from an action
      parameters:
        - $ref: "#/components/parameters/CohoActionReference"
      responses:
        "200":
          description: The action as saved after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionItem"
        "404":
          description: Action not found
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/actions/sync:
    post:
      operationId: syncCohoActions
      tags: [coho]
      summary: Pull every COHO action and save new or changed ones to Supabase
      parameters:
        - name: trigger
          in: query
          description: Recorded on the sync run; page-open when the Actions page refreshes stale data
          schema:
            type: string
            enum: [manual, page-open]
      responses:
        "200":
          description: Sync finished (or skipped because one was already running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionSyncResult"
        "502":
          description: COHO returned an error
        "503":
          description: COHO or the database is not configured
  /coho/viewings:
    post:
      operationId: createCohoViewing
      tags: [coho]
      summary: Book a COHO property viewing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoViewingInput"
      responses:
        "200":
          description: Created COHO viewing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoViewingCreated"
        "400":
          description: Invalid viewing details
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance:
    get:
      operationId: listCohoMaintenance
      tags: [coho]
      summary: List COHO maintenance issues
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: propertyReference
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated maintenance issue list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoMaintenancePage"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
    post:
      operationId: createCohoMaintenance
      tags: [coho]
      summary: Create a COHO maintenance issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoMaintenanceInput"
      responses:
        "200":
          description: Created COHO maintenance issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoMaintenanceCreated"
        "400":
          description: Invalid maintenance issue input
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance/categories:
    get:
      operationId: listCohoMaintenanceCategories
      tags: [coho]
      summary: List COHO maintenance categories
      responses:
        "200":
          description: Maintenance categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoMaintenanceCategories"
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance/{guid}:
    patch:
      operationId: updateCohoMaintenance
      tags: [coho]
      summary: Update COHO maintenance severity or manager notes
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoMaintenanceUpdate"
      responses:
        "200":
          description: COHO maintenance issue updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionResult"
        "400":
          description: Invalid maintenance update
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
  /coho/maintenance/{guid}/complete:
    patch:
      operationId: completeCohoMaintenance
      tags: [coho]
      summary: Mark a COHO maintenance issue complete
      parameters:
        - name: guid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CohoMaintenanceComplete"
      responses:
        "200":
          description: COHO maintenance issue completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohoActionResult"
        "400":
          description: Invalid completion request
        "502":
          description: COHO returned an error
        "503":
          description: COHO API key is not configured
components:
  parameters:
    CohoActionReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignupEmailCheckRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]
    SignupEmailCheckResult:
      type: object
      properties:
        allowed:
          type: boolean
        message:
          type: ["string", "null"]
      required: [allowed, message]
    CohoStatus:
      type: object
      properties:
        configured:
          type: boolean
        apiVersion:
          type: string
      required: [configured, apiVersion]
    CohoProperty:
      type: object
      properties:
        reference:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/CohoRoom"
      required: [reference, name, location]
    CohoRoom:
      type: object
      properties:
        reference:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
      required: [reference, name]
    CohoPropertiesPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CohoProperty"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
      required: [items, page, pageSize, totalCount, hasNextPage, hasPreviousPage]
    CohoCalendarEntry:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
          enum: [calendarItem, action, maintenanceIssue, propertyViewing, tenancy]
        entryType:
          type: string
        entryDate:
          description: ISO-8601 calendar entry date in UTC
          type: string
        endDate:
          description: ISO-8601 end date in UTC, when present
          type: ["string", "null"]
        isAllDay:
          type: boolean
        title:
          type: ["string", "null"]
        propertyReference:
          type: ["string", "null"]
        propertyName:
          type: ["string", "null"]
        roomReference:
          type: ["string", "null"]
        roomName:
          type: ["string", "null"]
        personName:
          type: ["string", "null"]
      required: [id, source, entryType, entryDate, endDate, isAllDay, title, propertyReference, propertyName, roomReference, roomName, personName]
    CohoCalendarPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CohoCalendarEntry"
      required: [items]
    CohoMaintenance:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        jobNumber:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        requestMessage:
          type: ["string", "null"]
        managerNotes:
          type: ["string", "null"]
        completionNotes:
          type: ["string", "null"]
        severity:
          type: string
        tenantName:
          type: ["string", "null"]
        tenantEmail:
          type: ["string", "null"]
        roomName:
          type: ["string", "null"]
        propertyName:
          type: ["string", "null"]
        roomReference:
          type: ["string", "null"]
        propertyReference:
          type: ["string", "null"]
        publicStatus:
          type: string
        detailedStatus:
          type: string
        dateMaintenanceScheduled:
          type: ["string", "null"]
          format: date-time
        dateMaintenanceCarriedOut:
          type: ["string", "null"]
          format: date-time
        dateMaintenanceCompleted:
          type: ["string", "null"]
          format: date-time
        maintenanceDueBy:
          type: ["string", "null"]
          format: date-time
        created:
          type: string
          format: date-time
      required: [guid, severity, publicStatus, detailedStatus, created]
    CohoMaintenancePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CohoMaintenance"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
      required: [items, page, pageSize, totalCount, hasNextPage, hasPreviousPage]
    CohoMaintenanceCategory:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        name:
          type: ["string", "null"]
        hierarchy:
          type: ["string", "null"]
        defaultSeverity:
          type: ["string", "null"]
      required: [guid, name, hierarchy, defaultSeverity]
    CohoMaintenanceCategories:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CohoMaintenanceCategory"
      required: [items]
    CohoMaintenanceInput:
      type: object
      properties:
        propertyReference:
          type: string
          minLength: 1
        roomReference:
          type: ["string", "null"]
        title:
          type: string
          minLength: 1
        requestMessage:
          type: ["string", "null"]
        managerNotes:
          type: ["string", "null"]
        severity:
          type: string
          enum: [unknown, low, medium, high]
        maintenanceCategoryGuid:
          type: ["string", "null"]
          format: uuid
      required: [propertyReference, title, severity]
    CohoMaintenanceUpdate:
      type: object
      properties:
        severity:
          type: string
          enum: [unknown, low, medium, high]
        managerNotes:
          type: ["string", "null"]
    CohoMaintenanceComplete:
      type: object
      properties:
        awaitingDecision:
          type: string
          enum: [complete, awaitingInvoice, awaitingOther]
        completionNotes:
          type: ["string", "null"]
        dateMaintenanceCarriedOut:
          type: ["string", "null"]
          format: date-time
      required: [awaitingDecision]
    CohoMaintenanceCreated:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        jobNumber:
          type: ["string", "null"]
      required: [guid, jobNumber]
    CohoActionResult:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    CohoViewingInput:
      type: object
      description: Booked by staff on behalf of a prospective tenant. COHO notifies the property manager and may text the applicant.
      properties:
        propertyReference:
          type: string
          minLength: 1
        roomReference:
          type: ["string", "null"]
        forename:
          type: string
          minLength: 1
          maxLength: 100
        surname:
          type: string
          minLength: 1
          maxLength: 100
        emailAddress:
          type: string
          format: email
        mobileNumber:
          type: ["string", "null"]
          maxLength: 30
        proposedDate:
          type: ["string", "null"]
          format: date-time
        proposedDuration:
          description: Length of the viewing in minutes
          type: ["integer", "null"]
          minimum: 15
          maximum: 240
        requestMessage:
          type: string
          minLength: 1
          maxLength: 2000
      required: [propertyReference, forename, surname, emailAddress, requestMessage]
    CohoActionCategory:
      type: string
      enum: [property, tenancy, maintenance, onboarding, viewing, other]
    CohoActionStatus:
      type: string
      enum: [not_set, new, in_progress, on_hold, completed]
    CohoActionItem:
      type: object
      properties:
        reference:
          type: string
        title:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/CohoActionStatus"
        type:
          type: string
        typeName:
          type: ["string", "null"]
        category:
          $ref: "#/components/schemas/CohoActionCategory"
        dueDate:
          type: ["string", "null"]
          format: date-time
        overdue:
          type: boolean
        snoozed:
          type: boolean
        snoozedUntil:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        propertyReference:
          type: ["string", "null"]
        propertyName:
          type: ["string", "null"]
        roomReference:
          type: ["string", "null"]
        roomName:
          type: ["string", "null"]
        assignedToName:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        progressionStepsCompleted:
          type: integer
        progressionStepsCount:
          type: integer
        firstSeenAt:
          description: When the sync first saved this action
          type: string
          format: date-time
        lastChangedAt:
          type: string
          format: date-time
        removedFromCoho:
          type: boolean
        archived:
          type: boolean
        assignedToGuid:
          type: ["string", "null"]
        canManuallyComplete:
          description: COHO only lets staff mark an action completed when this is true; others complete themselves
          type: boolean
        isCustom:
          description: Custom actions (MISC_CUSTOM_ACTION) are the only ones whose title, message, notes and due date can be edited
          type: boolean
      required: [reference, title, message, notes, status, type, typeName, category, dueDate, overdue, snoozed, snoozedUntil, completedAt, propertyReference, propertyName, roomReference, roomName, assignedToName, tags, progressionStepsCompleted, progressionStepsCount, firstSeenAt, lastChangedAt, removedFromCoho, archived, assignedToGuid, canManuallyComplete, isCustom]
    CohoActionCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: ["string", "null"]
          maxLength: 400
        notes:
          type: ["string", "null"]
          maxLength: 4000
        dueDate:
          type: ["string", "null"]
          format: date-time
        propertyReference:
          type: ["string", "null"]
          maxLength: 200
        roomReference:
          type: ["string", "null"]
          maxLength: 200
        assignTo:
          type: ["string", "null"]
          format: uuid
      required: [title]
    CohoActionEdit:
      type: object
      description: Only the fields sent are changed. Custom actions only.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: ["string", "null"]
          maxLength: 400
        notes:
          type: ["string", "null"]
          maxLength: 4000
        dueDate:
          type: ["string", "null"]
          format: date-time
    CohoActionStatusChange:
      type: object
      properties:
        status:
          type: string
          enum: [new, in_progress, on_hold, completed]
      required: [status]
    CohoActionAssign:
      type: object
      properties:
        assignTo:
          description: Organisation person GUID; null unassigns
          type: ["string", "null"]
          format: uuid
      required: [assignTo]
    CohoActionSnooze:
      type: object
      properties:
        until:
          type: string
          format: date-time
      required: [until]
    CohoActionAssignee:
      type: object
      properties:
        guid:
          type: string
        name:
          type: string
      required: [guid, name]
    CohoActionAssigneeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CohoActionAssignee"
      required: [items]
    CohoActionCategoryCounts:
      type: object
      properties:
        property:
          type: integer
        tenancy:
          type: integer
        maintenance:
          type: integer
        onboarding:
          type: integer
        viewing:
          type: integer
        other:
          type: integer
      required: [property, tenancy, maintenance, onboarding, viewing, other]
    CohoActionLastSync:
      type: object
      properties:
        status:
          type: string
          enum: [running, succeeded, failed]
        trigger:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        error:
          type: ["string", "null"]
      required: [status, trigger, startedAt, finishedAt, error]
    CohoActionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CohoActionItem"
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        hasNextPage:
          type: boolean
        categoryCounts:
          description: Matching actions per tab, ignoring the category filter
          allOf:
            - $ref: "#/components/schemas/CohoActionCategoryCounts"
        lastSync:
          description: Most recent successful sync, or null if none has run
          oneOf:
            - $ref: "#/components/schemas/CohoActionLastSync"
            - type: "null"
      required: [items, page, pageSize, totalCount, hasNextPage, categoryCounts, lastSync]
    CohoActionSyncResult:
      type: object
      properties:
        status:
          type: string
          enum: [succeeded, failed, skipped]
        fetched:
          type: integer
        created:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: ["string", "null"]
      required: [status, fetched, created, updated, removed, startedAt, finishedAt, error]
    CohoViewingCreated:
      type: object
      properties:
        guid:
          type: string
          format: uuid
        reference:
          type: ["string", "null"]
      required: [guid, reference]

